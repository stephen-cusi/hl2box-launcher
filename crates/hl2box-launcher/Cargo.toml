[package]
name = "hl2box-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "hl2box companion launcher: identity, addons, workshop, mounts, logs"

[[bin]]
name = "hl2box-launcher"
path = "src/main.rs"

[dependencies]
hl2box-core = { path = "../hl2box-core" }
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
sys-locale = "0.3"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
